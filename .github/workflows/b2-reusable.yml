# B2 (qa227): unsupported-topology fixture for TC-221 — a caller that uses a reusable workflow
# (b2-reusable-body.yml) for its environment job. Push-triggered on main only (paths b2-reusable/**).
# Helio must refuse ordinary adoption with a diagnosable reason; never dispatched by Helio.
name: b2-reusable
run-name: ${{ inputs.helio_execution_id || github.run_id }}

on:
  push:
    branches: [main]
    paths: ['b2-reusable/**', '.github/workflows/b2-reusable.yml', '.github/workflows/b2-reusable-body.yml']
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: false
        default: b2-reusable-test
        options: [b2-reusable-test]
      helio_execution_id:
        type: string
        required: false
        default: ''

# W3 dispatch contract (environment + helio_execution_id inputs, run-name echo) so Helio can bind the pipeline;
# GitHub-started push/schedule runs are what the adoption cases observe.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Declares the pinned target in the caller too (onboarding requires the target on a job or the
    # environment input); the deployment itself still happens in the reusable body below.
    environment: b2-reusable-test
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          echo "b2-reusable build"
          sleep "${{ vars.B2_TOPOLOGY_SLEEP || 10 }}"
  deploy:
    needs: build
    # Same-repository reusable body whose environment job is a matrix (the unsupported reusable shape, as in GH-48).
    # Plain same-repository and SHA-pinned cross-repository bodies are supported and are adopted (B2-HF-04).
    uses: ./.github/workflows/b2-reusable-body.yml
    with:
      target: b2-reusable-test
