# B2 (qa227, 28 Oct 2026): TC-223 adopted-job fixture (governed adoption on b2-govern-test, Helio reviewer only).
#
# GitHub-started by a push to b2-jobs/**. Repository variables select the variant without a commit:
#   B2_JOBS_LINT=skip            declared NON-deployment job `lint` is skipped          (same-run-optional-skip)
#   B2_JOBS_DEPLOY=skip          the required deployment job `deploy` is skipped       (required-deploy-skip)
#   B2_JOBS_EXTRA=run            an extra job runs under a runtime name that differs from its declared name
#                                (`extra-${{ github.run_id }}`), i.e. a job Helio's pinned graph does not declare (undeclared-job)
#   B2_JOBS_PROOF=delete         the deploy job deactivates and deletes its own GitHub deployment (missing-proof)
#   B2_JOBS_PROOF=extra          the deploy job adds a second successful deployment for the same sha/environment
#                                pointing at the same job log (mismatched-proof: proof is no longer unique)
#   (all unset)                  successful control
# Nothing is deployed; deployment records are synthetic evidence only. W3 dispatch contract present so Helio can bind it.
name: b2-jobs
run-name: ${{ inputs.helio_execution_id || github.run_id }}

on:
  push:
    branches: [main]
    paths: ['b2-jobs/**', '.github/workflows/b2-jobs.yml']
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: false
        default: b2-govern-test
        options: [b2-govern-test]
      helio_execution_id:
        type: string
        required: false
        default: ''

permissions:
  contents: read
  deployments: write

concurrency:
  group: b2-jobs-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Synthetic build
        shell: bash
        env:
          SLEEP_SECONDS: ${{ vars.B2_JOBS_BUILD_SLEEP || '240' }}
        run: |
          set -euo pipefail
          echo "b2-jobs build run=$GITHUB_RUN_ID lint=${{ vars.B2_JOBS_LINT }} deploy=${{ vars.B2_JOBS_DEPLOY }} extra=${{ vars.B2_JOBS_EXTRA }} proof=${{ vars.B2_JOBS_PROOF }}"
          sleep "$SLEEP_SECONDS"

  lint:
    needs: build
    if: ${{ vars.B2_JOBS_LINT != 'skip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        run: echo "b2-jobs optional lint (no environment)"

  extra:
    needs: build
    if: ${{ vars.B2_JOBS_EXTRA == 'run' }}
    name: ${{ vars.B2_JOBS_EXTRA == 'run' && format('extra-{0}', github.run_id) || 'extra' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        run: echo "b2-jobs extra job with a runtime name"

  deploy:
    needs: [build, lint]
    if: ${{ always() && needs.build.result == 'success' && vars.B2_JOBS_DEPLOY != 'skip' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: b2-govern-test
    steps:
      - name: Synthetic deployment evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF: ${{ vars.B2_JOBS_PROOF }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          if [ "$PROOF" = "delete" ]; then
            for id in $(curl -fsS "${auth[@]}" "$api/deployments?sha=$GITHUB_SHA&environment=b2-govern-test" | python3 -c 'import json,sys;print(" ".join(str(d["id"]) for d in json.load(sys.stdin)))'); do
              curl -fsS -X POST "${auth[@]}" "$api/deployments/$id/statuses" --data '{"state":"inactive"}' > /dev/null
              curl -fsS -X DELETE "${auth[@]}" "$api/deployments/$id" > /dev/null && echo "deleted deployment $id"
            done
          fi
          if [ "$PROOF" = "extra" ]; then
            job_url="$(curl -fsS "${auth[@]}" "$api/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" | python3 -c 'import json,sys;print([j["html_url"] for j in json.load(sys.stdin)["jobs"] if j["name"]=="deploy"][0])')"
            id="$(curl -fsS -X POST "${auth[@]}" "$api/deployments" --data "{\"ref\":\"$GITHUB_SHA\",\"environment\":\"b2-govern-test\",\"auto_merge\":false,\"required_contexts\":[],\"task\":\"b2-extra-proof\"}" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')"
            curl -fsS -X POST "${auth[@]}" "$api/deployments/$id/statuses" --data "{\"state\":\"success\",\"log_url\":\"$job_url\"}" > /dev/null
            echo "extra deployment $id"
          fi
          echo "b2-jobs synthetic deployment to b2-govern-test; nothing deployed"
