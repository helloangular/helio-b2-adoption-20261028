# B2 (qa227): unsupported-topology fixture for TC-221 — a matrix job targeting an environment.
# Push-triggered on main only (paths b2-matrix/**). Helio must refuse ordinary adoption with a
# diagnosable reason; this workflow is never dispatched by Helio.
name: b2-matrix
run-name: ${{ inputs.helio_execution_id || github.run_id }}

on:
  push:
    branches: [main]
    paths: ['b2-matrix/**', '.github/workflows/b2-matrix.yml']
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: false
        default: b2-observe-test
        options: [b2-observe-test]
      helio_execution_id:
        type: string
        required: false
        default: ''

# W3 dispatch contract (environment + helio_execution_id inputs, run-name echo) so Helio can bind the pipeline;
# GitHub-started push/schedule runs are what the adoption cases observe.
permissions:
  contents: read

jobs:
  deploy:
    strategy:
      matrix:
        region: [east, west]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: b2-observe-test
    steps:
      - name: Synthetic matrix deployment (${{ matrix.region }})
        shell: bash
        run: |
          set -euo pipefail
          echo "b2-matrix ${{ matrix.region }}"
          sleep 10
